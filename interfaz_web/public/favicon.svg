<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sfaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>
    <filter id="sfaShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
  </defs>
  <!-- Base Squircle -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#sfaGrad)" filter="url(#sfaShadow)" />

  <!-- Subtle Inner Border -->
  <rect x="5.5" y="5.5" width="53" height="53" rx="14.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Shield / Guardian Heartline Outline -->
  <path d="M32 14 C39 14 47 18 47 25 C47 37 32 48 32 48 C32 48 17 37 17 25 C17 18 25 14 32 14 Z"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="3.5"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- Pulse / ECG Lifeline inside Heart Shield -->
  <path d="M22 28.5 L27 28.5 L29.5 22 L33.5 35 L36.5 26 L38.5 28.5 L42 28.5"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- Live Status Dot (Emerald) -->
  <circle cx="47" cy="17" r="4.5" fill="#10B981" stroke="#FFFFFF" stroke-width="2" />
</svg>
