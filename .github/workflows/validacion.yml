name: Validacion de fuentes
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pc-web:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: interfaz_web/package-lock.json
      - run: python -m pip install -r servidor_pc/requirements.txt
      - run: npm ci
        working-directory: interfaz_web
      - run: npm test
        working-directory: interfaz_web
      - run: npm run build
        working-directory: interfaz_web
      - run: npm run build:access
        working-directory: interfaz_web
        env:
          VITE_SUPABASE_URL: https://lxymfaoraayccmxwiubw.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_tlHmnEy5vrZghpCDtuehjg_IpGtEn4S
      - run: python -m unittest discover -s tests -v
  sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: supabase/validation
      - run: npm test
        working-directory: supabase/validation
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: chmod +x gradlew
        working-directory: android_app
      - run: ./gradlew --no-daemon testDebugUnitTest assembleDebug lintDebug
        working-directory: android_app
      - uses: actions/upload-artifact@v4
        with:
          name: Android-prototipo-pruebas
          path: |
            android_app/app/build/outputs/apk/debug/*.apk
            android_app/app/build/reports/tests/**
            android_app/app/build/reports/lint-results-debug.*
